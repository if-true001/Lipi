<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lipi</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Supermercado+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/layout.css">
</head>
<body>

    <input type="file" id="fallback-file-input" style="display: none;" accept=".txt,.md,.html,.css,.js,.json">

    <div id="drawer-overlay" class="scrim hidden"></div>
    <div id="modal-overlay" class="scrim hidden"></div>

    <!-- Save As Modal -->
    <div id="save-as-modal" class="m3-dialog hidden">
        <h3 class="title-large">Save As</h3>
        <div class="dialog-content">
            <input type="text" id="save-as-input" class="m3-text-input" placeholder="Enter file name..." autocomplete="off">
        </div>
        <div class="dialog-actions">
            <button class="m3-btn m3-btn-text" id="modal-cancel-btn">Cancel</button>
            <button class="m3-btn m3-btn-filled" id="modal-save-btn">Save</button>
        </div>
    </div>

    <!-- NEW: Unsaved Warning Modal -->
    <div id="unsaved-modal" class="m3-dialog hidden">
        <h3 class="title-large" style="color: var(--md-sys-color-on-surface);">Save Changes?</h3>
        <div class="dialog-content">
            <p id="unsaved-modal-message" class="body-large" style="margin: 0; color: var(--md-sys-color-outline);"></p>
        </div>
        <div class="dialog-actions" style="margin-top: 8px;">
            <button class="m3-btn m3-btn-text" id="modal-unsaved-cancel-btn">Cancel</button>
            <div style="display: flex; gap: 8px;">
                <button class="m3-btn m3-btn-text m3-btn-danger" id="modal-unsaved-discard-btn">Discard</button>
                <button class="m3-btn m3-btn-filled" id="modal-unsaved-save-btn">Save</button>
            </div>
        </div>
    </div>

    <aside id="sidebar" class="md-drawer">
        <div class="drawer-header">
            <h2 class="title-large brand-font" style="font-size: 32px;">Lipi</h2>
        </div>
        
        <div class="drawer-content">
            <span class="label-large section-label">ACTIVE FILES</span>
            <ul id="open-files-list" class="drawer-list">
                <li class="drawer-item active" id="welcome-sidebar-item">
                    <div class="file-info">
                        <span class="material-symbols-rounded icon">waving_hand</span>
                        <span class="file-name brand-font" style="font-size: 18px;">Lipi</span>
                    </div>
                </li>
            </ul>
        </div>

        <div class="drawer-footer">
            <button class="drawer-item" id="settings-btn">
                <span class="material-symbols-rounded icon">settings</span>
                <span class="file-name">Settings</span>
            </button>
        </div>
    </aside>

    <main id="workspace">
        <header class="top-app-bar">
            <div class="top-bar-left">
                <button class="icon-btn" id="menu-btn" aria-label="Open menu">
                    <span class="material-symbols-rounded">menu</span>
                </button>
                <span id="current-file-name" class="title-medium brand-font" style="font-size: 22px;">Lipi</span>
                <span id="unsaved-indicator" style="display: none; color: var(--md-sys-color-primary); font-size: 14px; margin-left: -2px;">●</span>
            </div>
            
            <div class="top-bar-right">
                <div class="dropdown-anchor">
                    <button class="icon-btn" id="add-btn" aria-label="Add new or open">
                        <span class="material-symbols-rounded">add</span>
                    </button>
                    
                    <div id="add-dropdown" class="m3-menu hidden">
                        <button class="menu-item" id="dropdown-new-file">
                            <span class="material-symbols-rounded">note_add</span> New File
                        </button>
                        <button class="menu-item" id="dropdown-open-file">
                            <span class="material-symbols-rounded">folder_open</span> Open File...
                        </button>
                        
                        <div id="dropdown-recent-group">
                            <div class="menu-divider"></div>
                            <span class="menu-label">Recent</span>
                            <div id="dropdown-recent-list"></div>
                        </div>
                    </div>
                </div>

                <div class="dropdown-anchor">
                    <button class="icon-btn dropdown-btn" id="save-btn" aria-label="Save options" disabled>
                        <span id="main-save-icon" class="material-symbols-rounded">save</span>
                        <span class="material-symbols-rounded" style="font-size: 20px;">arrow_drop_down</span>
                    </button>
                    
                    <div id="save-dropdown" class="m3-menu hidden">
                        <button class="menu-item" id="dropdown-action-save" disabled>
                            <span id="icon-action-save" class="material-symbols-rounded">save</span> Save
                        </button>
                        <button class="menu-item" id="dropdown-action-save-as">
                            <span id="icon-action-save-as" class="material-symbols-rounded">save_as</span> Save As...
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <div id="welcome-view" class="editor-canvas active">
            <div class="welcome-content">
                <h1 class="brand-font brand-hero">Lipi</h1>
                
                <div class="action-columns">
                    <div class="action-group">
                        <span class="label-large">Start</span>
                        <button class="text-btn" id="action-new-file">
                            <span class="material-symbols-rounded">add</span> New File
                        </button>
                        <button class="text-btn" id="action-open-file">
                            <span class="material-symbols-rounded">folder_open</span> Open File...
                        </button>
                    </div>

                    <div class="action-group" id="welcome-recent-group">
                        <span class="label-large">Recent</span>
                        <div id="recent-files-container" class="recent-list"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="editor-view" class="editor-canvas hidden">
            <textarea id="main-editor" class="body-large" spellcheck="false" placeholder="Start typing..."></textarea>
        </div>
    </main>

    <script src="js/app.js" type="module"></script>
</body>
</html>
